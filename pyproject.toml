[project]
name = "careerlab"
version = "0.1.0"
description = "Gradient Depression strategy laboratory for TechArena Career Survival: official-MCP episode runner, policy registry, pre-registered statistics and worker actors."
requires-python = ">=3.11,<3.14"
dependencies = [
    # Pinned to the official participation repository lock (RAI-Internal/techarena-career-sim @ 00b084a8).
    "career-emulator-engine[mcp]==1.0.6",
    "career-emulator-techarena==1.0.8",
    "fastmcp==2.14.7",
    "mcp==1.27.2",
    "pyyaml>=6",
    # Lab-side analysis only; not used by the game server.
    "numpy>=2",
    "scipy>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
careerlab = "careerlab.cli:main"

[tool.uv]
# Every shared transitive dependency is constrained to the official participation lock
# (RAI-Internal/techarena-career-sim @ 00b084a8) so the MCP server runs with the same stack.
